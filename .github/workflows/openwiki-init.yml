name: OpenWiki Init

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    runs-on: ubuntu-latest
    environment: Build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Initialize OpenWiki
        run: openwiki code --init --print
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: gpt-5.5
          LANGCHAIN_TRACING_V2: "false"

      - name: Create OpenWiki init pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            AGENTS.md
            openwiki
          branch: openwiki/init
          commit-message: "docs: initialize OpenWiki"
          title: "docs: initialize OpenWiki"
          body: |
            Initial OpenWiki documentation generation.

            This PR was generated by the manual OpenWiki init workflow.
