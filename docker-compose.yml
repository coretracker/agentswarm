services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=agentswarm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/agentswarm}
      - REPO_CACHE_ROOT=/repo-cache
      - REPO_CACHE_VOLUME=agentswarm_repo_cache
      - RUNTIME_PAYLOAD_ROOT=/runtime-payloads
      - RUNTIME_PAYLOAD_VOLUME=agentswarm_runtime_payloads
      - TASK_WORKSPACE_ROOT=/task-workspaces
      - SECRET_KEY_PATH=/secrets/agentswarm.key
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3217}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Administrator}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@agentswarm.local}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123!}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-agentswarm_session}
      - AUTH_SESSION_TTL_DAYS=${AUTH_SESSION_TTL_DAYS:-7}
      - DOCKER_SOCKET_ACCESS_ENABLED=${DOCKER_SOCKET_ACCESS_ENABLED:-false}
      - DOCKER_SOCKET_HOST_PATH=${DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}
      - DOCKER_SOCKET_CONTAINER_PATH_CODEX=${DOCKER_SOCKET_CONTAINER_PATH_CODEX:-/var/run/docker.sock}
      - DOCKER_SOCKET_CONTAINER_PATH_CLAUDE=${DOCKER_SOCKET_CONTAINER_PATH_CLAUDE:-/var/run/docker.sock}
    expose:
      - "4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repo_cache:/repo-cache
      - runtime_payloads:/runtime-payloads
      - ./task-workspaces:/task-workspaces
      - server_secrets:/secrets
    depends_on:
      - redis
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3217"
    depends_on:
      - server

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-3217}:3217"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - server

volumes:
  redis_data:
  postgres_data:
  repo_cache:
    name: agentswarm_repo_cache
  runtime_payloads:
    name: agentswarm_runtime_payloads
  server_secrets:
    name: agentswarm_server_secrets
